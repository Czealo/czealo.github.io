<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="snakeHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7a0"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="snakeBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="snakeTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="foodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="foodFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景：撑满整个画布 -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- 网格线 -->
  <g stroke="#151515" stroke-width="1.5" opacity="0.8">
    <line x1="80" y1="0" x2="80" y2="512"/>
    <line x1="144" y1="0" x2="144" y2="512"/>
    <line x1="208" y1="0" x2="208" y2="512"/>
    <line x1="272" y1="0" x2="272" y2="512"/>
    <line x1="336" y1="0" x2="336" y2="512"/>
    <line x1="400" y1="0" x2="400" y2="512"/>
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="144" x2="512" y2="144"/>
    <line x1="0" y1="208" x2="512" y2="208"/>
    <line x1="0" y1="272" x2="512" y2="272"/>
    <line x1="0" y1="336" x2="512" y2="336"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
  </g>

  <!-- 食物光晕 -->
  <circle cx="368" cy="136" r="52" fill="url(#foodGlow)"/>

  <!-- 食物 -->
  <g filter="url(#foodFilter)">
    <rect x="336" y="104" width="64" height="64" rx="16" ry="16" fill="#ef4444"/>
    <rect x="348" y="116" width="20" height="20" rx="6" ry="6" fill="#ff6b6b" opacity="0.5"/>
  </g>

  <!-- 蛇身 -->
  <rect x="72" y="288" width="64" height="64" rx="14" ry="14" fill="#16a34a" opacity="0.55"/>
  <rect x="128" y="288" width="64" height="64" rx="14" ry="14" fill="#16a34a" opacity="0.7"/>
  <rect x="128" y="224" width="64" height="64" rx="14" ry="14" fill="url(#snakeTail)"/>
  <rect x="192" y="224" width="64" height="64" rx="14" ry="14" fill="url(#snakeBody)"/>
  <rect x="256" y="224" width="64" height="64" rx="14" ry="14" fill="url(#snakeBody)"/>
  <rect x="256" y="160" width="64" height="64" rx="14" ry="14" fill="url(#snakeBody)"/>
  <rect x="320" y="160" width="64" height="64" rx="14" ry="14" fill="url(#snakeBody)"/>
</svg>